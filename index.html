<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Teste Animação</title>

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      /* 100dvh evita o "pulo" causado pela barra de endereço em celulares */
      height: 100vh;
      height: 100dvh;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <!-- GSAP via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- Three.js via CDN (ES modules) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('app');

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setClearColor(0x000000, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // limita o custo em telas de alta densidade
    container.appendChild(renderer.domElement);

    // Cena e câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

    // Objeto de exemplo (confirma que Three.js e GSAP estão funcionando)
    const mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1, 1),
      new THREE.MeshStandardMaterial({ color: 0x4f8cff, flatShading: true })
    );
    scene.add(mesh);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(3, 4, 5);
    scene.add(light);

    // Ajusta tamanho e enquadramento para PC (paisagem) e celular (retrato)
    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      const aspect = width / height;

      renderer.setSize(width, height, false);
      camera.aspect = aspect;

      // Em telas verticais, afasta a câmera para o conteúdo caber na largura
      camera.position.z = aspect < 1 ? 5 / aspect : 5;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    resize();

    // Animação com GSAP
    gsap.from(mesh.scale, { x: 0, y: 0, z: 0, duration: 1.5, ease: 'elastic.out(1, 0.5)' });
    gsap.to(mesh.rotation, { y: Math.PI * 2, duration: 8, ease: 'none', repeat: -1 });
    gsap.to(mesh.rotation, { x: Math.PI * 2, duration: 12, ease: 'none', repeat: -1 });

    // Loop de renderização sincronizado com o ticker do GSAP
    gsap.ticker.add(() => renderer.render(scene, camera));
  </script>
</body>
</html>
