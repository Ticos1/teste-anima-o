<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Teste Animação</title>

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      /* 100dvh evita o "pulo" causado pela barra de endereço em celulares */
      height: 100vh;
      height: 100dvh;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Aviso exibido quando a imagem não é encontrada */
    #aviso {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #bbb;
      font: 15px/1.5 system-ui, sans-serif;
      cursor: pointer;
    }

    #aviso.visivel {
      display: flex;
    }

    #aviso code {
      color: #ff5a5a;
    }
  </style>

  <!-- GSAP via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- Three.js via CDN (ES modules) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="aviso">
    <p>
      Imagem não encontrada em <code>assets/zumbi-de-sangue.png</code>.<br />
      Toque aqui para escolher a imagem ou arraste o arquivo para a página.
    </p>
  </div>
  <input id="arquivo" type="file" accept="image/*" hidden />

  <script type="module">
    import * as THREE from 'three';

    // ---------------------------------------------------------------
    // Configuração
    // ---------------------------------------------------------------
    const CONFIG = {
      imagem: 'assets/zumbi-de-sangue.png',
      tolerancia: 60,   // distância de cor (0–441) até onde um pixel conta como fundo
      suavizacao: 40,   // faixa extra usada para suavizar a borda do recorte
      tamanhoMax: 2048, // lado máximo da textura, em pixels
      alturaPlano: 3.2  // altura do plano na cena, em unidades do Three.js
    };

    const container = document.getElementById('app');
    const aviso = document.getElementById('aviso');
    const inputArquivo = document.getElementById('arquivo');

    // Renderer com fundo transparente sobre o preto da página
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // limita o custo em telas de alta densidade
    container.appendChild(renderer.domElement);

    // Cena e câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

    // Ajusta tamanho e enquadramento para PC (paisagem) e celular (retrato)
    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      const aspect = width / height;

      renderer.setSize(width, height, false);
      camera.aspect = aspect;

      // Em telas verticais, afasta a câmera para o conteúdo caber na largura
      camera.position.z = aspect < 1 ? 5 / aspect : 5;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    resize();

    // ---------------------------------------------------------------
    // Carregamento da imagem
    // ---------------------------------------------------------------
    function carregarImagem(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Falha ao carregar ${url}`));
        img.src = url;
      });
    }

    // ---------------------------------------------------------------
    // Recorte do fundo
    // Estima a cor do fundo pelas bordas da imagem e faz um flood fill
    // a partir delas: só é removido o fundo conectado às bordas, então
    // partes da criatura com cor parecida com o fundo são preservadas.
    // ---------------------------------------------------------------
    function recortarFundo(img) {
      const escala = Math.min(1, CONFIG.tamanhoMax / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * escala);
      const h = Math.round(img.naturalHeight * escala);

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);

      const dados = ctx.getImageData(0, 0, w, h);
      const px = dados.data;

      // Pixels da borda da imagem
      const borda = [];
      for (let x = 0; x < w; x++) borda.push(x, (h - 1) * w + x);
      for (let y = 1; y < h - 1; y++) borda.push(y * w, y * w + w - 1);

      // Se a imagem já tem fundo transparente (PNG recortado), usa o alfa original
      const bordaTransparente = borda.filter((i) => px[i * 4 + 3] < 128).length;
      if (bordaTransparente / borda.length > 0.5) return cortarAoConteudo(canvas, ctx, dados);

      // Cor de fundo = mediana de cada canal nos pixels da borda
      const mediana = (canal) => {
        const v = borda.map((i) => px[i * 4 + canal]).sort((a, b) => a - b);
        return v[v.length >> 1];
      };
      const fundo = [mediana(0), mediana(1), mediana(2)];

      const distancia = (i) => {
        const dr = px[i * 4] - fundo[0];
        const dg = px[i * 4 + 1] - fundo[1];
        const db = px[i * 4 + 2] - fundo[2];
        return Math.sqrt(dr * dr + dg * dg + db * db);
      };

      // Flood fill (BFS) a partir das bordas
      const limite = CONFIG.tolerancia;
      const removido = new Uint8Array(w * h);
      const fila = new Int32Array(w * h);
      let inicio = 0;
      let fim = 0;

      for (const i of borda) {
        if (!removido[i] && distancia(i) <= limite) {
          removido[i] = 1;
          fila[fim++] = i;
        }
      }

      while (inicio < fim) {
        const i = fila[inicio++];
        const x = i % w;
        const vizinhos = [
          x > 0 ? i - 1 : -1,
          x < w - 1 ? i + 1 : -1,
          i - w,
          i + w
        ];
        for (const n of vizinhos) {
          if (n < 0 || n >= w * h || removido[n]) continue;
          if (distancia(n) <= limite) {
            removido[n] = 1;
            fila[fim++] = n;
          }
        }
      }

      // Aplica a máscara e suaviza a borda da criatura
      const faixa = CONFIG.suavizacao;
      for (let i = 0; i < w * h; i++) {
        if (removido[i]) {
          px[i * 4 + 3] = 0;
          continue;
        }
        const x = i % w;
        const tocaFundo =
          (x > 0 && removido[i - 1]) ||
          (x < w - 1 && removido[i + 1]) ||
          (i >= w && removido[i - w]) ||
          (i < w * (h - 1) && removido[i + w]);
        if (tocaFundo) {
          const t = Math.min(1, Math.max(0, (distancia(i) - limite) / faixa));
          px[i * 4 + 3] = Math.round(px[i * 4 + 3] * (t * t * (3 - 2 * t)));
        }
      }

      return cortarAoConteudo(canvas, ctx, dados);
    }

    // Recorta o canvas até a área visível, para o plano ter o tamanho da criatura
    function cortarAoConteudo(canvas, ctx, dados) {
      const { width: w, height: h, data: px } = dados;
      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (px[(y * w + x) * 4 + 3] > 8) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) throw new Error('O recorte removeu a imagem inteira; diminua a tolerância.');

      ctx.putImageData(dados, 0, 0);
      const saida = document.createElement('canvas');
      saida.width = maxX - minX + 1;
      saida.height = maxY - minY + 1;
      saida.getContext('2d').drawImage(canvas, minX, minY, saida.width, saida.height, 0, 0, saida.width, saida.height);
      return saida;
    }

    // ---------------------------------------------------------------
    // Mesh do Zumbi de Sangue
    // ---------------------------------------------------------------
    let zumbi = null;

    function criarZumbi(canvasRecortado) {
      if (zumbi) {
        gsap.killTweensOf([zumbi.position, zumbi.scale, zumbi.material]);
        scene.remove(zumbi);
        zumbi.geometry.dispose();
        zumbi.material.map.dispose();
        zumbi.material.dispose();
      }

      const textura = new THREE.CanvasTexture(canvasRecortado);
      textura.colorSpace = THREE.SRGBColorSpace;
      textura.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const proporcao = canvasRecortado.width / canvasRecortado.height;
      let altura = CONFIG.alturaPlano;
      let largura = altura * proporcao;
      if (largura > 4.2) { // imagens muito largas: limita pela largura
        largura = 4.2;
        altura = largura / proporcao;
      }

      const material = new THREE.MeshBasicMaterial({
        map: textura,
        transparent: true,
        alphaTest: 0.01,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      zumbi = new THREE.Mesh(new THREE.PlaneGeometry(largura, altura), material);
      scene.add(zumbi);

      // Entrada e flutuação com GSAP
      material.opacity = 0;
      gsap.to(material, { opacity: 1, duration: 1.2, ease: 'power2.out' });
      gsap.from(zumbi.scale, { x: 0.6, y: 0.6, duration: 1.4, ease: 'back.out(1.7)' });
      gsap.to(zumbi.position, { y: 0.12, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    }

    async function usarImagem(url) {
      const img = await carregarImagem(url);
      criarZumbi(recortarFundo(img));
      aviso.classList.remove('visivel');
    }

    // Arquivo escolhido pelo usuário (funciona até abrindo o HTML direto do disco)
    function usarArquivo(arquivo) {
      if (!arquivo || !arquivo.type.startsWith('image/')) return;
      const url = URL.createObjectURL(arquivo);
      usarImagem(url)
        .catch((erro) => console.error(erro))
        .finally(() => URL.revokeObjectURL(url));
    }

    aviso.addEventListener('click', () => inputArquivo.click());
    inputArquivo.addEventListener('change', () => usarArquivo(inputArquivo.files[0]));
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      usarArquivo(e.dataTransfer.files[0]);
    });

    usarImagem(CONFIG.imagem).catch((erro) => {
      console.warn(erro.message);
      aviso.classList.add('visivel');
    });

    // Loop de renderização sincronizado com o ticker do GSAP
    gsap.ticker.add(() => renderer.render(scene, camera));
  </script>
</body>
</html>
